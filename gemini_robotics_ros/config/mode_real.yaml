# mode:=real  --  gerçek SICK Visionary-T Mini V3S145-1A
#
# gemini_params.yaml'ın ÜSTÜNE biner. Burada YALNIZCA sim ile gerçek arasında
# gerçekten farklı olan şeyler bulunur.
#
# Kullanım:
#     ros2 launch gemini_robotics_ros gemini_pick_place.launch.py mode:=real
#
# NOT: MoveIt tarafı DEĞİŞMEZ. Komutlar sim'de de gerçekte de /move_action'a,
# yani gerçek MoveIt'e gider (moveit_backend: "real"). Gerçek robota geçerken
# değiştirilecek tek şey kamera, o da bu dosya.
/**:
  ros__parameters:

    # hil_test_whole_unified.launch.py içindeki UR kamerası:
    #   Node(name="sick_visionary_t_mini_ur")  -- NAMESPACE YOK
    # Sürücü topic'leri göreli açıyor (visionary_t_mini.cpp:221-225), yani
    # namespace'siz düğümde kök namespace'e düşerler.
    #
    # Kawasaki kamerası namespace="sick_kawasaki" ile açılıyor; onunkiler
    # /sick_kawasaki/... altında kalır ve buraya karışmaz.
    cloud_topic: "/points"
    depth_topic: "/depth"
    camera_info_topic: "/camera_info"
    # Gerçek SICK IR genlik üretir - sim'de olmayan tek modalite.
    # İstenirse bir tarama pozunda scan_pose_render_mode: "intensity" olabilir.
    intensity_topic: "/intensity"
    # Gerçek kamerada RGB YOK (visionary_t_mini.cpp:221-225'te RGB publisher'ı
    # bile yok). Bu topic hiç yayınlanmaz; er_image_source "render" KALMALI.
    image_topic: "/rgb_yok"

    # Gerçek donanımda /clock yayınlayan yok; true kalırsa ROS saati 0'da donar
    # ve TF lookup'ları dahil zamana bağlı her şey sessizce ölür.
    use_sim_time: false

    # Sürücü bulutu "ur10e_sick_optical_frame" ile damgalar (launch'ta
    # frame_id parametresi böyle veriliyor) - URDF'teki depth_optical_frame
    # DEĞİL. Mesajın kendi header'ı doğru olduğu için override boş kalır;
    # kalibrasyon farkı TF zincirinde çözülür.
    camera_frame_override: ""

    # Gerçek depth 16UC1 ve MİLİMETRE cinsinden gelir; depth_to_metres bunu
    # zaten çeviriyor, ek ayar gerekmiyor.
