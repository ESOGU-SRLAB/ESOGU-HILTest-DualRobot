/**:
  ros__parameters:
    use_sim_time: true

    # --- ER backend ---
    # gemini : Gemini API. GEMINI_API_KEY ortam değişkeninden okunur; buraya
    #          anahtar YAZMAYIN (yaml repoya girer).
    #              export GEMINI_API_KEY="AIza..."
    # vertex : Vertex AI (vertex_project doldurulmalı)
    backend: "gemini"
    model: "gemini-robotics-er-2-preview"
    thinking_level: "high"
    jpeg_quality: 90
    vertex_project: ""
    vertex_location: "us-central1"

    # --- ER'ye verilen görüntü ---
    # render : DERİNLİKTEN üretilir. Gerçek SICK Visionary-T Mini'nin RGB modu
    #          olmadığı için sim ve gerçek arasında taşınabilen tek seçenek.
    # rgb    : Gazebo'nun RGB kamerası. Yalnız sim'de vardır, gerçeğe TAŞINMAZ.
    er_image_source: "render"
    # relief | normals | turbo | gray | intensity  (intensity yalnız gerçek donanımda)
    #
    # relief: baskın düz yüzeyi (bant/masa) bulup ONA GÖRE YÜKSEKLİĞİ boyar.
    # normals ile ölçülen sorun: bandın üstündeki 29 mm'lik kutunun üst yüzü
    # bantla aynı normale sahip, dolayısıyla aynı tonda çıkıyordu - kontrast
    # 1.7/255. Kutu görüntüde yalnızca ince bir kenar çizgisiydi ve ER onu
    # bulamadı. Sabit 0.3-4.0 m pencereli turbo/gray de 29 mm'yi 2-3/255'e
    # sıkıştırıyor. relief'te aynı karede kontrast 89.8/255.
    #
    # Pencere kameranın uzaklığına değil YÜZEYE göre tanımlı olduğu için kol
    # yaklaşıp uzaklaşınca bozulmaz ve gerçek SICK'te birebir aynı hesaplanır.
    render_mode: "relief"
    # relief'te bu ikisi yalnız geçerlilik maskesidir (bu aralık dışı = veri yok),
    # renk skalasını belirlemezler. Diğer modlarda sabit metrik aralıktır: sim ve
    # gerçek görüntüler aynı görünsün diye kareye göre değil sahneye göre seçilir.
    render_min_m: 0.3
    render_max_m: 4.0
    # ER 2'nin gerçekte gördüğü kareyi /gemini/er_image olarak yayınlar.
    # "Model neden orayı gösterdi" sorusunun tek cevabı bu görüntü.
    publish_er_image: true
    # Önizleme yayın hızı (Hz). Sorgudan BAĞIMSIZ olarak yayınlar; 0 = kapalı.
    # Sorgu göndermeden önce kadrajın doğru olduğunu RViz'de görebilmek için.
    er_image_rate_hz: 2.0

    # --- kamera topic'leri ---
    # BURADA DEĞİL. Sim ile gerçek arasındaki TEK fark kamera (ve saat) olduğu
    # için bunlar mode overlay'lerine taşındı:
    #     config/mode_sim.yaml
    #     config/mode_real.yaml
    # launch, mode:=sim | mode:=real ile hangisinin bineceğini seçer.

    world_frame: "world"
    # Boş bırakılırsa mesajın kendi header.frame_id'si kullanılır.
    camera_frame_override: ""

    # cloud | depth | auto (önce bulut, olmazsa depth+CameraInfo)
    #
    # "cloud" olmalı, "auto" DEĞİL. Ölçüldü (10 Ağu 2026, canlı hücre):
    # Gazebo bulutu x-ileri konvansiyonunda geliyor (x = mesafe, 0.5-2.1 m,
    # %100 pozitif) ve URDF'teki depth_optical_joint'in rpy(-pi/2,-pi/2,0)
    # açısıyla birlikte world'e DOĞRU düşüyor (world Z: 0.00-1.61 m, zeminin
    # altında %0 nokta).
    # Depth yolu ise pinhole ile OPTİK konvansiyonda (z = mesafe) nokta üretir;
    # aynı frame'e damgalandığında 90 derece dönük olur ve nokta hücrenin
    # dışına düşer. "auto" iken bulut bir an gelmezse sessizce bu yanlış yola
    # kayar - o yüzden kapalı.
    deprojection: "cloud"
    sample_window: 5
    max_items: 10
    marker_lifetime_sec: 0.0

    # --- yüzey düzlemi / vakum uygunluğu ---
    # ER 2'nin gösterdiği pikselin çevresine düzlem oturtulur; normal buradan
    # gelir. Emme kabı yüzeye dik oturmazsa sızdırır, bu yüzden bu blok
    # vakumlu kavramada opsiyonel değildir.
    patch_radius_px: 12
    patch_depth_band: 0.05      # yamaya arka planın karışmasını engeller
    patch_min_points: 25
    max_surface_rms: 0.004      # 4 mm'den bozuk yüzey = kenar/köşe, reddedilir
    min_surface_inliers: 40
    max_surface_tilt_deg: 180.0 # 180 = eğim denetimi kapalı (dikey yüzeyler serbest)
    require_surface: true       # yüzey çıkarılamazsa kavramayı hiç deneme

    # --- hareket ---
    # real : /move_action (gerçek MoveIt, grup real_ur10e, önek ur10e_).
    #        real_to_sim_bridge zaten Gazebo'yu aynaladığı için sim'de de
    #        hareket görülür ve gerçek robota geçerken HİÇBİR ŞEY değişmez.
    #        digital_twin:=true GEREKMEZ.
    # sim  : /sim/move_action (grup sim_ur10e). Yalnız digital_twin:=true iken
    #        sunucusu vardır; aksi halde istek sonsuza kadar bekler.
    moveit_backend: "real"
    planning_frame: "world"
    # Boş = backend'e göre otomatik. real + vakum -> ur10e_suction_cup
    # (gerçek SRDF: <chain base_link="ur10e_table" tip_link="ur10e_suction_cup"/>)
    end_effector: ""
    planner_id: "RRTConnectkConfigDefault"
    max_velocity: 0.2
    max_acceleration: 0.2
    planning_attempts: 10
    planning_time: 10.0

    # Açılışta SCAN pozuna git (kamera bilekte; sorgudan önce konveyörü gören
    # sabit bir poza gitmezsek ER 2'ye hücre duvarları sorulmuş olur).
    move_to_scan_on_start: true
    startup_delay_sec: 8.0

    # 7 eklem, SIRA ÖNEMLİ: base_to_robot_mount (lineer ray), shoulder_pan,
    # shoulder_lift, elbow, wrist_1, wrist_2, wrist_3.
    # /sim/joint_states'in "name" dizisi bu sırada DEĞİL - oradan kopyalarken
    # yeniden sıralayın.
    #
    # Konveyörü gören poz (10 Ağu 2026, ikinci ölçüm). Ham okunan değerler:
    #   base_to_robot_mount +0.54520   (prizmatik ray - ASLA sarılmaz)
    #   shoulder_pan        +5.20030 -> -1.08288
    #   shoulder_lift       -0.60626
    #   elbow               +0.53539
    #   wrist_1             +3.21313 -> -3.07005
    #   wrist_2             -5.20054 -> +1.08265
    #   wrist_3             -6.28178 -> +0.00141
    # Sağdakiler 2pi sarımı alınmış eşdeğerler: her döner eklem 2pi periyodik
    # olduğu için AYNI fiziksel pozu verir, sıfırdan gidişte 840 derece daha az
    # yol kat eder. Ayrıca ham wrist_3 (-6.28178) sert limite (-6.28319) sadece
    # 0.0014 rad = 0.08 derece kalıyordu; en ufak aşımda gerçek robotta limit
    # hatası olur. Sarımsız hali tam marjla çalışır.
    scan_joints: [0.54520, -1.08288, -0.60626, 0.53539, -3.07005, 1.08265, 0.00141]
    home_joints: [0.54520, -1.08288, -0.60626, 0.53539, -3.07005, 1.08265, 0.00141]

    # --- ÇOK POZLU TARAMA -------------------------------------------------
    # Bilek kamerası kolla hareket ediyor; konveyör ile toolkit aynı kadraja
    # sığmıyor (aralarında 1.17 m ray hareketi var). Hedefler pozlarda sırayla
    # aranır, bulunan ilk pozda durulur. Tespitler world frame'ine çevrildiği
    # için farklı pozlardan gelenler aynı haritada birikir.
    #
    # scan_pose_joints DÜZLEŞTİRİLMİŞ dizidir: poz sırasına göre 7'şerli.
    # İlk poz aynı zamanda açılış pozudur.
    scan_pose_names: ["conveyor", "toolkit"]
    scan_pose_joints: [
      # conveyor  (10 Ağu 2026, 2pi sarımı alınmış)
      0.54520, -1.08288, -0.60626,  0.53539, -3.07005,  1.08265,  0.00141,
      # toolkit   (11 Ağu 2026 - YANDAN bakış yerine ÜSTTEN bakış)
      #
      # NEDEN DEĞİŞTİ: eski poz rafa neredeyse yatay bakıyordu. O kadrajda beş
      # raf tabanı da birbirinin aynısı dört koyu dikdörtgen olarak çıkıyor ve
      # "üstten açık olan sıra" görsel olarak ayırt edilemiyordu. ER üst üste
      # üç koşuda alt gözleri gösterdi (z=0.729 / 0.519 / 0.261); doğrulama
      # hepsini eledi ve görev bırakma hedefi bulunamadan düştü.
      #
      # Yeni pozda kamera (0.066, 1.279, 1.819) noktasından 67.2 derece
      # AŞAĞI bakıyor. Üst tepsi kadrajın en büyük düz yüzeyi (7281 piksel) ve
      # üstünde hiçbir şey olmadığı doğrudan görünüyor; alt gözler ise açıkça
      # kapalı duruyor. Dört seviye de görünür durumda:
      #   z=0.938 (üst tepsi) 7281 px | 0.727: 1998 | 0.517: 1174 | 0.259: 2108
      #
      # Ham okunan /joint_states'ten YENİDEN SIRALANDI (oradaki sıra farklı):
      #   base_to_robot_mount +1.59841
      #   shoulder_pan        -1.63740
      #   shoulder_lift       -1.20571
      #   elbow               +0.67570
      #   wrist_1             -2.61012
      #   wrist_2             +1.63544
      #   wrist_3             -0.39832
      # Hiçbiri sarım gerektirmiyor, hepsi limitlerin içinde.
      1.59841, -1.63740, -1.20571,  0.67570, -2.61012,  1.63544, -0.39832,
    ]
    # Render modu POZ BAŞINA. Tek bir mod iki bakışa birden yetmiyor:
    #
    # conveyor: banda TEPEDEN bakılıyor, parça düz bir yüzeyin üstünde 29 mm'lik
    #           bir çıkıntı. normals'ta üst yüz bantla aynı normale sahip olduğu
    #           için görünmüyordu (1.7/255) -> relief şart.
    # toolkit : rafa YANDAN bakılıyor, sahne 0.68-1.84 m'ye yayılıyor. relief'in
    #           yükseklik penceresine piksellerin ancak %50'si giriyor, gerisi
    #           doyuyor ve görüntü okunmaz oluyor (ER hiçbir şey bulamadı).
    #           normals burada sahneyi 3B gri render gibi gösteriyor, raf
    #           gözleri net seçiliyor.
    scan_pose_render_mode: ["relief", "normals"]
    # relief yükseklik penceresi (yalnız relief pozlarında kullanılır).
    # Boş göz bir ÇUKUR olduğu için lo negatif olmalı: 45 mm derin göz için
    # ölçüldü, lo=-0.005'te 28/255, lo=-0.08'de 50/255 kontrast.
    scan_pose_height_lo_m: [-0.005, -0.080]
    scan_pose_height_hi_m: [ 0.120,  0.120]
    # Poz değiştikten sonra derinlik/bulut tazelensin diye beklenen süre.
    # Kısa tutulursa ER'ye bir ÖNCEKİ pozun karesi gösterilir ve tespit o anki
    # TF ile çevrildiği için sessizce yanlış bir 3D nokta üretilir.
    scan_settle_sec: 1.0

    # --- UÇ ELEMAN GEOMETRİSİ --------------------------------------------
    # İkisi de ur10e_suction_cup mesh'inden ÖLÇÜLDÜ (10 Ağu 2026).
    #
    # tool_approach_vector: emme yönü, uç eleman frame'inde. EKSENE HİZALI
    # DEĞİL. Mesh'e dönel yüzey ekseni uyduruldu (normaller eksenini keser
    # kısıtı, alan ağırlıklı): sonuç (0.8661, 0.4999, 0.0002) yani frame X'ten
    # tam 30.00 derece - CAD'de kasıtlı bir açı. Bağımsız iki ölçüm doğruladı:
    # montaj yüzü normalinin tersi ve ağız düzlemi uyumu (0.56 derece fark).
    #
    # Doğrulama: gerçek eksen boyunca kesit yarıçapı düzgün ilerliyor
    # (sap 4.9 -> şaft 7.1 sabit -> çan 15.6 -> 19.8 -> ağız 20.0 mm), oysa
    # frame X boyunca rastgele zıplıyordu (4.7, 11.7, 7.9, 11.8, 3.7, ...).
    #
    # Önce "z" varsayılmıştı: kap YATAY geliyordu (90 derece hata).
    # Sonra "x": 30 derece eğik kalıyordu.
    #
    # tool_tip_offset: kap ağzının frame ORİJİNİNE göre yeri. Ağız halkası
    # eksen boyunca 84.2 mm'de, yarıçapı 19.5 mm (Ø39 mm kap) ve eksene dik
    # (halkanın eksen boyunca std'si 0.07 mm - yani ağız gerçekten düz).
    #
    # DÜZELTİLDİ 11 Ağu 2026: burada 156 mm yazıyordu. Mesh 84 mm'de bitiyor,
    # yani böyle bir nokta kabın 72 mm ÖTESİNDE, havada. Hedefi frame'e
    # çevirirken (frame = uç - R*offset) offset ne kadar uzunsa kol o kadar
    # geride durur: kap her yüzeyin 71.8 mm ÜSTÜNDE kalıyordu ve vakum boşa
    # çekiyordu. Belirti algı hatası gibi görünüyordu ama kamera doğru yeri
    # gösteriyordu - yanlış olan uç eleman sabitiydi.
    #
    # İKİSİ DE ELLE YAZILMAZ. Ölç ve buraya yapıştır:
    #     ros2 run gemini_robotics_ros measure_tcp --compare 0.07292 0.04210 0.0
    # URDF'i /robot_state_publisher'dan, yani MoveIt'in planladığı modelin ta
    # kendisinden okur; mesh'e dönel yüzey ekseni uydurup ağız halkasını bulur.
    # Kap değişirse tek yapılacak bu komutu tekrar çalıştırmak.
    tool_approach_vector: [0.8660254, 0.5, 0.0]
    tool_tip_offset: [0.072920, 0.042100, 0.0]

    # Yüzey normalini en yakın dünya eksenine oturtma toleransı (derece).
    # Bant ve raf yüzeyleri işlenmiş ve dünya eksenlerine göre düz; normali
    # derinlik yamasından PCA ile kestirince birkaç derece gürültü biniyor.
    # ÖLÇÜLDÜ: bırakma pozunda kap dikeyden 3.99 derece sapmıştı. Ø23 mm'lik
    # kapta 4 derece, bir kenarda ~1.6 mm boşluk demek - gerçek donanımda
    # vakum sızdırır.
    #
    # Bu bir MODELLEME VARSAYIMI: yüzeylerin gerçekten eksene hizalı olduğunu
    # kabul eder. Eğik yüzeylerle çalışacaksanız 0.0 yapıp kapatın.
    # Kavranabilirlik eğim denetimi her hâlükârda ÖLÇÜLEN normale bakar.
    normal_snap_deg: 15.0

    # Yüzey normali çıkarılamazsa kullanılan yedek oryantasyon (yukarıdan aşağı).
    fallback_quat_xyzw: [1.0, 0.0, 0.0, 0.0]
    # Yaklaşma, oturtma ve kaldırma NORMAL boyunca yapılır (dünya Z'si boyunca
    # değil): dikey bir yüzeyden parça çekmek ancak böyle doğru olur.
    # Hedefi KAVRAMADAN ÖNCE MoveIt'e sor (/compute_ik, çarpışma denetimli).
    #
    # ÖLÇÜLDÜ 11 Ağu 2026: ER, toolkit rafında üstten İKİNCİ sıradaki gözü
    # gösterdi. Nokta doğruydu (ölçülen taban 0.729 m, mesh'teki raf 0.727 m),
    # ama o gözün TAVANI var - üstündeki raf 211 mm yukarıda. Yukarıdan dik
    # inince emme kabının sapı rafın içinden geçiyordu (MoveIt: kap <-> bin,
    # 9.5 mm). Gözün ağzı 172 mm, kavrayıcı gövdesi Ø167 mm; yandan da girmez.
    # Bu, parça KAVRANDIKTAN sonra ortaya çıkıyordu - kol havada asılı kaldı.
    #
    # Doğrulama açıkken ulaşılamaz aday elenir ve ER'nin verdiği bir SONRAKİ
    # aday denenir (üst sıra gözü, tabanı 0.938 m, yukarı açık - MoveIt onu
    # geçerli buluyor).
    validate_targets: true
    ik_timeout_sec: 3.0

    # Yaklaşma mesafesi UYARLANIR: approach_distance ilk denenir, çarpışırsa
    # sırayla küçültülür. Tek sabit değer iki yere birden uymuyor - bantta
    # 15 cm iyi, raf gözünde aynı 15 cm önkolu kablo kanalına sokuyor
    # (ölçüldü: üst sırada 0.15 geçersiz, 0.10 ve altı geçerli).
    approach_distance_candidates: [0.15, 0.12, 0.10, 0.08, 0.06]
    approach_distance: 0.15
    touch_offset: 0.002
    lift_distance: 0.20
    place_clearance: 0.05

    # BIRAKMA hedefinde dikeyden bu kadar sapmış bir yüzey normali kabul
    # edilmez; yerine yukarıdan iniş kullanılır. Gerekçe fizik: yatay normalli
    # bir yüzeye parça bırakılamaz, yerçekimi düşürür.
    #
    # 11 Ağu 2026 ölçümü: ER üst bölmeyi DOĞRU gösterdi, ama işaret ettiği
    # piksel rafın ön yüzüne düştü ve normal (0,-1,0) çıktı. Kol yandan
    # girmeye çalıştı, beş yaklaşma mesafesinin beşi de çarpıştı. Aynı nokta
    # yukarıdan inişle 15 cm'de geçerli. 0 = denetimi kapat.
    place_max_normal_tilt_deg: 45.0

    # Bırakmadan önce place_clearance yüksekliğine inilsin mi.
    #
    # false (varsayılan): parça APPROACH_PLACE pozundan, yani hedefin
    #   approach_distance kadar üstünden bırakılır. Raf gözüne inerken
    #   kartezyen plan sürekli yarıda kalıyordu (önce %20, kap düzeldikten
    #   sonra %75) - gripper gövdesi (Ø~120 mm) gözün ağzına sığmıyor.
    #   Parça 15 cm'den düşer; hafif ve kırılmaz parçalar için sorun değil.
    # true: klasik davranış. Gözün ağzı gövdeyi alacak kadar genişse ya da
    #   parçayı yavaşça bırakmak gerekiyorsa açın; approach_distance'ı da
    #   küçültmek gerekebilir.
    descend_before_release: false

    # --- VGC10 vakum kavrayıcı ---
    # vacuum | none. VGC10'da aktüe edilen eklem yoktur; kavrama Modbus
    # komutuyla yapılır ve MoveIt2Gripper bu donanımda tanımsızdır.
    gripper_type: "vacuum"
    vacuum_command_topic: "/OnRobotVGOutput"
    vacuum_status_topic: "/OnRobotVGInput"
    vacuum_pct: 60              # OnRobot sınırı: 80'i aşmayın
    vacuum_use_both_channels: true
    # Sim'de VGC10 sürücüsü çalışmaz, durum mesajı hiç gelmez -> false bırakın.
    # Gerçek robotta true yapın: o zaman "tuttu mu" gerçekten doğrulanır.
    vacuum_require_confirmation: false
    vacuum_confirm_pct: 15.0
    vacuum_timeout_sec: 3.0

    # --- Gazebo'da gerçekten tutma (DetachableJoint) ---
    # gz-sim 8.14'te vakum/suction eklentisi YOK. Parçanın taşınabilmesi için
    # emme kabı ile parça arasına koparılabilir sabit bir eklem kuruluyor
    # (whole_cell_sim.urdf.xacro). Bu topic'ler ROS→Gazebo köprüsüne gider.
    #
    # Bağ, mesajın ULAŞTIĞI ANDAKİ göreli pozla kurulur; bu yüzden attach,
    # vakum komutuyla aynı anda (kap parçaya değerken) gönderiliyor.
    #
    # GERÇEK ROBOTTA ZARARSIZ: köprü yalnızca sim launch'ında var, gerçek
    # hücrede bu topic'leri kimse dinlemez. Kapatmak için boş bırakın.
    sim_attach_topic: "/vacuum/attach"
    sim_detach_topic: "/vacuum/detach"

    # --- taşınan parçanın çarpışma gövdesi ---
    # Kavranan parça artık robotun bir parçasıdır. MoveIt bunu bilmezse kutuyu
    # rafın kenarına, konveyöre ya da kolun kendisine sürter - planlayıcı için
    # orada hiçbir şey yoktur.
    #
    # ELLE VERİLİR: algı parçanın boyutunu ÖLÇMÜYOR (ER bir nokta veriyor).
    # Buradaki değer RedCube'un ölçüsü. Başka bir parça alacaksanız burayı
    # güncelleyin; kuşkudaysanız BÜYÜK tutun - fazla büyük kutu gereksiz yere
    # plan reddettirir, küçük kutu ise sessizce çarpışmaya izin verir.
    # Boş liste = kapalı (parça sahneye hiç eklenmez).
    # Boyut ÖNCE DERİNLİKTEN ölçülür; payload_size yalnızca ölçüm başarısız
    # olursa devreye girer (yeterli piksel yok, malzeme okumadı, yükseklik
    # sınırlar dışında). Log hangisinin kullanıldığını yazar.
    #
    # Ölçüm neyi verir: uzunluk, genişlik, yükseklik VE düzlem içi yönelim.
    # Yükseklik en güvenilir olanıdır - üst yüzün ve destek düzleminin baskın
    # seviyeleri arasındaki fark, yüzlerce pikselden. Sentetik sahnede 5 mm'lik
    # piksel gürültüsünde bile 30 mm'lik kutu 3 mm hatayla ölçüldü.
    #
    # Ölçemediği şeyler (hepsi sessizce eksik sonuç verir):
    #   * destek düzleminin ALTI (ayaklı/oyuk tabanlı parçada siluet ölçülür)
    #   * "düz bir yüzeyin üstünde duruyor" varsayımı bozulursa referans yanlış
    #   * oklüzyonda kalan yüzler -> ayak izi EKSİK çıkar
    #   * ToF'un okuyamadığı malzemeler (mat siyah, parlak metal, şeffaf)
    payload_measure: true
    # Her kenara eklenen güvenlik payı (iki yana da uygulanır).
    payload_margin_m: 0.005
    # Bu aralık dışındaki yükseklikler ölçüm hatası sayılır ve yedeğe düşülür.
    payload_min_height_m: 0.004
    payload_max_height_m: 0.30
    payload_size: [0.14, 0.083, 0.03]
    payload_object_id: "gemini_payload"
    # Parçaya DEĞMESİ normal olan link'ler; verilmezse kavrama anı çarpışma
    # sayılır ve hiçbir plan üretilemez. Boş = önekten türetilir
    # (suction_cup, vacuum_gripper, tool0, wrist_3_link).
    payload_touch_links: [""]

    # --- güvenlik ---
    # ER yanlış yeri gösterirse ya da derinlik gürültülüyse hedef buraya
    # düşmez ve hareket hiç planlanmaz. Kendi hücrenize göre daraltın.
    # z alt sınırı 0.60'tan 0.45'e indirildi: konveyör yüzeyi ölçümde ~0.58 m
    # çıkıyor ve 0.60 sınırı kutunun kendisini reddediyordu.
    workspace_min: [-2.0, -2.0, 0.45]
    workspace_max: [2.0, 3.0, 2.00]

    # true iken tüm algı çalışır ama robot hareket etmez (ilk denemeler için)
    dry_run: false
