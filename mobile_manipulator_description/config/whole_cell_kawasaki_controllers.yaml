# ==============================================================================
# WHOLE CELL KAWASAKI + AGV CONTROLLERS (İKİNCİ CONTROLLER_MANAGER)
# ==============================================================================
# Bu CM, "/kawasaki" namespace'inde çalışır (node: /kawasaki/controller_manager).
# UR CM'inden (/controller_manager) namespace ile ayrılır; NODE ADI DEĞİŞTİRİLMEZ.
# NEDEN: ros2_control_node'a `name:=...` vermek global `-r __node:=...` remap'ine
# dönüşür ve bu remap CM'in yüklediği TÜM controller node'larına sızar; controller
# yanlış isimle (CM'in adıyla) açılır ve kendi parametrelerini (joints,
# command_interfaces) bulamaz. Namespace bu sızıntıyı yapmaz.
#
# Controller'lar artık /kawasaki altında olduğundan parametreleri "/**" wildcard
# ile verilir (örn. /kawasaki/kawasaki_controller eşleşir).
# ==============================================================================
/kawasaki/controller_manager:
  ros__parameters:
    update_rate: 100

    kawasaki_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    kawasaki_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    ota_base_controller:
      type: diff_drive_controller/DiffDriveController


/**:
  kawasaki_joint_state_broadcaster:
    ros__parameters:
      use_local_topics: false

  kawasaki_controller:
    ros__parameters:
      joints:
        - world_to_agv
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - joint6
      command_interfaces:
        - position
      state_interfaces:
        - position
        - velocity
      state_publish_rate: 100.0
      action_monitor_rate: 20.0
      allow_partial_joints_goal: true
      allow_nonzero_velocity_at_trajectory_end: true
      constraints:
        stopped_velocity_tolerance: 0.5
        goal_time: 0.0
        world_to_agv: { trajectory: 0.5, goal: 0.3 }
        joint1: { trajectory: 0.2, goal: 0.1 }
        joint2: { trajectory: 0.2, goal: 0.1 }
        joint3: { trajectory: 0.2, goal: 0.1 }
        joint4: { trajectory: 0.2, goal: 0.1 }
        joint5: { trajectory: 0.2, goal: 0.1 }
        joint6: { trajectory: 0.2, goal: 0.1 }

  ota_base_controller:
    ros__parameters:
      left_wheel_names:
        - wheel_left_base
      right_wheel_names:
        - wheel_right_base
      wheel_separation: 0.60
      wheel_radius: 0.102
      base_frame_id: ota_base_link
      odom_frame_id: odom
      cmd_vel_timeout: 0.25
      use_stamped_vel: false
      publish_rate: 50.0
      velocity_rolling_window_size: 10
      enable_odom_tf: true
      linear:
        x:
          has_velocity_limits: true
          max_velocity: 1.0
          has_acceleration_limits: true
          max_acceleration: 1.5
      angular:
        z:
          has_velocity_limits: true
          max_velocity: 2.0
          has_acceleration_limits: true
          max_acceleration: 3.0
